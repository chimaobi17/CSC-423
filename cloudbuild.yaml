steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/chat-repo/chat-app:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/chat-repo/chat-app:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - chat-app
      - --image
      - us-central1-docker.pkg.dev/$PROJECT_ID/chat-repo/chat-app:$SHORT_SHA
      - --region
      - us-central1
      - --allow-unauthenticated
      - --timeout
      - "3600"
      - --concurrency
      - "80"
      - --max-instances
      - "1"
      - --add-cloudsql-instances
      - $_INSTANCE_CONNECTION_NAME
      - --set-env-vars
      - NODE_ENV=production,DB_USER=chatuser,DB_NAME=chatdb,DB_SOCKET_DIR=/cloudsql,INSTANCE_CONNECTION_NAME=$_INSTANCE_CONNECTION_NAME,ALLOWED_ORIGIN=$_ALLOWED_ORIGIN
      - --set-secrets
      - DB_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/chat-repo/chat-app:$SHORT_SHA
substitutions:
  _INSTANCE_CONNECTION_NAME: "PROJECT_ID:us-central1:chat-db"
  _ALLOWED_ORIGIN: "https://REPLACE_AFTER_FIRST_DEPLOY"
