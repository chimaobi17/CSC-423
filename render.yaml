services:
  - type: web
    name: chatbridge-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chatbridge-db
          property: connectionString

databases:
  - name: chatbridge-db
    plan: free
    region: oregon
    databaseName: chatbridge
    user: chatbridge_user
    postgresMajorVersion: '15'
